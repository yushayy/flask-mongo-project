<!DOCTYPE html>
<html>
<head>
  <title>Submit Data</title>
</head>
<body>
  <h2>Submit Your Info</h2>
  {% if error %}
    <p style="color:red;">Error: {{ error }}</p>
  {% endif %}
  <form method="POST">
    <label>Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Age:</label><br>
    <input type="number" name="age" required><br><br>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
